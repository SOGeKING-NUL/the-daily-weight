# The daily run. 06:00 IST: gather, rank, write, check, build, commit, deploy, email, post the
# morning thread. 19:45 IST (10:15 ET, when AI Twitter is at its desk): the evening posts.
# The repo variable PUBLISH decides what the schedule does: unset, nothing (a fresh repo is safe);
# "dry", the whole build with nothing leaving the runner; "on", the lot. A manual run always builds
# and publishes only when PUBLISH is "on" and dry_run is off.
name: Edition

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD); default today in India'
        required: false
      dry_run:
        description: 'Build everything, publish nothing'
        type: boolean
        default: false

concurrency: edition
permissions:
  contents: write
  issues: write

env:
  SITE_URL: ${{ vars.SITE_URL }}
  PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
  PUBLISH: ${{ (vars.PUBLISH == 'on' && !inputs.dry_run) && 'on' || 'off' }}

jobs:
  edition:
    if: github.event.schedule != '15 14 * * *' && (github.event_name == 'workflow_dispatch' || vars.PUBLISH == 'on' || vars.PUBLISH == 'dry')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
      X_LIST_ID: ${{ vars.X_LIST_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - id: date
        run: echo "date=${{ inputs.date || '' }}" >> "$GITHUB_OUTPUT"
      - name: Gather
        run: node scripts/fetch.mjs ${{ steps.date.outputs.date }}
      - name: Rank
        run: node scripts/rank.mjs ${{ steps.date.outputs.date }}
      - name: Write
        run: node scripts/write.mjs ${{ steps.date.outputs.date }}
      - name: Cards
        run: node scripts/cards.mjs ${{ steps.date.outputs.date }}
      - name: Check
        # exit 3 = must-cover stories left undecided: one more pass at them, then go with what we have
        run: |
          node scripts/check.mjs ${{ steps.date.outputs.date }} || {
            [ $? -eq 3 ] || exit 1
            node scripts/write.mjs ${{ steps.date.outputs.date }} --gaps
            node scripts/cards.mjs ${{ steps.date.outputs.date }}
            node scripts/check.mjs ${{ steps.date.outputs.date }} --final
          }

      - name: Commit the edition
        if: env.PUBLISH == 'on'
        run: |
          git config user.name 'daily-weight-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add content public/images
          git commit -m "Edition $(ls drafts/*.ranked.json | head -1 | grep -o '[0-9-]\{10\}')" || echo 'nothing new'
          git push
      - name: Deploy
        if: env.PUBLISH == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true
      - name: Email
        if: env.PUBLISH == 'on'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: node scripts/newsletter.mjs ${{ steps.date.outputs.date }}
      - name: Post on X
        if: env.PUBLISH == 'on'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-x.mjs morning ${{ steps.date.outputs.date }}

      - name: File what was left undecided
        if: env.PUBLISH == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls drafts/*.gaps.md 2>/dev/null | head -1) || true
          [ -n "$f" ] && gh issue create --title "Undecided must-cover stories: $(basename "$f" .gaps.md)" --body-file "$f" || echo 'no gaps'

  evening:
    if: github.event.schedule == '15 14 * * *' && vars.PUBLISH == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/cards.mjs
      - if: env.PUBLISH == 'on'
        run: node scripts/post-x.mjs evening
